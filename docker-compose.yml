x-common-config: &common-config
  build:
    context: .
    dockerfile: Dockerfile
    args:
      NUJINAGENT_CHANNELS: ${NUJINAGENT_CHANNELS:-whatsapp}
  environment:
    NUJINAGENT_DOCKER_BOOTSTRAP: "1"
    NUJINAGENT_WEB_TOKEN: ${NUJINAGENT_WEB_TOKEN:-}
  volumes:
    - ~/.nujinagent:/home/nujinagent/.nujinagent
  cap_drop:
    - ALL
  # Entrypoint uses these to fix bind-mount ownership and drop to the nujinagent user.
  cap_add:
    - CHOWN
    - SETGID
    - SETUID
  # Prevent the non-root process from regaining capabilities through setuid
  # binaries or file capabilities left inside the container image.
  security_opt:
    - no-new-privileges:true

services:
  nujinagent-gateway:
    container_name: nujinagent-gateway
    <<: *common-config
    command: ["gateway"]
    restart: unless-stopped
    ports:
      - 127.0.0.1:18790:18790
      - 8765:8765
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  nujinagent-cli:
    <<: *common-config
    profiles:
      - cli
    command: ["status"]
    stdin_open: true
    tty: true
